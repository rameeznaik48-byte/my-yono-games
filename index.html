<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Yono Games</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#100d20;
  color:white;
}
header{
  background:#1b1430;
  padding:16px;
  border-bottom:2px solid #8b5cf6;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.brand{
  font-size:23px;
  font-weight:900;
  color:#b99aff;
}
.telegram{
  background:#20c997;
  color:#071b16;
  padding:10px 15px;
  border-radius:9px;
  text-decoration:none;
  font-weight:bold;
}
.hero{
  text-align:center;
  padding:38px 15px;
  background:linear-gradient(135deg,#321568,#123c35);
}
.hero h1{
  font-size:30px;
  margin-bottom:10px;
}
.hero p{color:#ddd;margin-bottom:22px}
.btn{
  display:inline-block;
  padding:13px 22px;
  margin:5px;
  border:0;
  border-radius:9px;
  background:#8b5cf6;
  color:white;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
}
.btn.green{background:#20c997;color:#071b16}
.container{padding:20px;max-width:1100px;margin:auto}
h2{margin:10px 0 17px;color:#b99aff}
.search{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #6845a8;
  background:#211936;
  color:white;
  margin:10px 0 18px;
  font-size:16px;
}
.categories{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.categories button{
  padding:10px 14px;
  border:1px solid #7951bd;
  border-radius:20px;
  background:#211936;
  color:white;
  cursor:pointer;
}
.categories button.active{
  background:#20c997;
  color:#071b16;
  border-color:#20c997;
}
.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:14px;
}
.game{
  background:#211936;
  border:1px solid #49316e;
  border-radius:13px;
  padding:16px 10px;
  text-align:center;
}
.logo{
  width:75px;
  height:75px;
  margin:0 auto 12px;
  border-radius:15px;
  background:#080808;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#20c997;
  font-size:14px;
  font-weight:900;
  border:2px solid #20c997;
}
.game h3{font-size:16px;margin-bottom:7px}
.game p{font-size:12px;color:#c6b7df;margin-bottom:12px}
.play{
  display:block;
  background:#20c997;
  color:#071b16;
  text-decoration:none;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
}
.empty{color:#bbb;text-align:center;padding:25px;display:none}
footer{
  text-align:center;
  padding:25px;
  margin-top:30px;
  background:#1b1430;
  color:#aaa;
}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">🎮 MY YONO GAMES</div>
    <a class="telegram" href="https://t.me/rameeznaikontop" target="_blank">JOIN TELEGRAM</a>
  </div>
</header>

<section class="hero">
  <h1>WELCOME TO MY YONO GAMES</h1>
  <p>Explore your favourite games in one place</p>
  <button class="btn green" onclick="showAll()">PLAY NOW</button>
  <button class="btn" onclick="showAll()">EXPLORE NOW</button>
</section>

<main class="container" id="gamesSection">
  <h2>🔥 Explore Games</h2>
  <input class="search" id="search" type="search"
    placeholder="Search your games..." oninput="renderGames()">

  <div class="categories">
    <button class="active" onclick="chooseCategory('All Games',this)">All Games</button>
    <button onclick="chooseCategory('Casino',this)">Casino Games</button>
    <button onclick="chooseCategory('Dice',this)">Dice Games</button>
    <button onclick="chooseCategory('Card',this)">Card Games</button>
    <button onclick="chooseCategory('Mini',this)">Mini Games</button>
  </div>

  <div class="games" id="gameList"></div>
  <div class="empty" id="empty">No games found.</div>
</main>

<footer>
  <p>© 2026 MY YONO GAMES</p>
  <p>All Games in One Place</p>
</footer>

<script>
const gameList = [
  {
    name:"DHAN GAME",
    category:"Casino",
    logo:"DHAN GAME",
    link:"https://www.dhangmaegame.com/?code=47T85N5B1AU&t=1794756436"
  }

  // Apne naye games isi format mein add karna:
  // {name:"Game Name",category:"Dice",logo:"DICE",link:"https://example.com"}
];

let currentCategory="All Games";

function chooseCategory(category,button){
  currentCategory=category;
  document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  renderGames();
}

function showAll(){
  currentCategory="All Games";
  document.querySelectorAll(".categories button").forEach(b=>{
    b.classList.toggle("active",b.textContent==="All Games");
  });
  document.getElementById("gamesSection").scrollIntoView({behavior:"smooth"});
  renderGames();
}

function renderGames(){
  const search=document.getElementById("search").value.toLowerCase();
  const list=document.getElementById("gameList");
  list.innerHTML="";

  const filtered=gameList.filter(game=>{
    const categoryMatch=currentCategory==="All Games" || game.category===currentCategory;
    const searchMatch=game.name.toLowerCase().includes(search);
    return categoryMatch && searchMatch;
  });

  filtered.forEach(game=>{
    const card=document.createElement("div");
    card.className="game";
    const logo=document.createElement("div");
    logo.className="logo";
    logo.textContent=game.logo || game.name;
    const title=document.createElement("h3");
    title.textContent=game.name;
    const category=document.createElement("p");
    category.textContent=game.category+" Game";
    const link=document.createElement("a");
    link.className="play";
    link.href=game.link;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent="PLAY GAME";

    card.append(logo,title,category,link);
    list.appendChild(card);
  });

  document.getElementById("empty").style.display=filtered.length?"none":"block";
}

renderGames();
</script>
</body>
</html>
