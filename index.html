body{font-family:Arial,sans-serif;background:#100d20;color:white}
header{text-align:center;padding:30px 15px;background:linear-gradient(135deg,#26104d,#6416a8)}
header h1{font-size:30px;margin-bottom:8px}
.container{max-width:1000px;margin:auto;padding:20px 15px}
.search{width:100%;padding:14px;border-radius:10px;border:1px solid #65439b;background:#211a35;color:white;font-size:16px;margin-bottom:18px}
.categories{display:flex;gap:10px;overflow-x:auto;padding-bottom:15px}
.categories button{flex-shrink:0;border:0;padding:11px 17px;border-radius:20px;background:#302447;color:white;cursor:pointer}
.categories button.active,.categories button:hover{background:#8738df}
h2{margin:15px 0}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px}
.game-card{background:#211a35;border:1px solid #49366b;border-radius:14px;padding:18px 12px;text-align:center}
.game-icon{font-size:38px;margin-bottom:12px}
.game-card h3{margin-bottom:8px}
.game-card p{color:#c5bad8;font-size:13px;margin-bottom:14px}
.game-card a{display:block;background:#8738df;color:white;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold}
.empty{display:none;text-align:center;padding:25px;color:#c5bad8}
footer{margin-top:35px;padding:25px 15px;text-align:center;background:#1c1530;color:#c5bad8}
.telegram{display:inline-block;margin:15px 0;padding:12px 22px;background:#229ED9;color:white;text-decoration:none;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>My Yono Games</h1>
<p>Explore Apps, Games, Latest Offers and Official Download Links</p>
</header>

<main class="container">
<input class="search" type="search" id="searchInput" placeholder="Search games..." oninput="filterGames()">

<div class="categories">
<button class="active" onclick="setCategory('All Games',this)">All Games</button>
<button onclick="setCategory('Casino Games',this)">Casino Games</button>
<button onclick="setCategory('Dice Games',this)">Dice Games</button>
<button onclick="setCategory('Card Games',this)">Card Games</button>
<button onclick="setCategory('Mini Games',this)">Mini Games</button>
<button onclick="setCategory('Other Games',this)">Other Games</button>
</div>

<h2>Explore Games</h2>
<div class="games" id="gamesList">

<div class="game-card" data-category="Card Games">
<div class="game-icon">🃏</div>
<h3>123 Rummy</h3>
<p>Card game information</p>
<a href="https://www.123rummy46.com/?code=HT9KA5FGGJB&amp;t=1794799060" target="_blank" rel="noopener noreferrer">Open Link</a>
</div>

<div class="game-card" data-category="Casino Games">
<div class="game-icon">🎰</div>
<h3>Dhan Game</h3>
<p>Game information</p>
<a href="https://www.dhangmaegame.com/?code=47T85N5B1AU&amp;t=1794799704" target="_blank" rel="noopener noreferrer">Open Link</a>
</div>


<script>
let selectedCategory="All Games";

function setCategory(category,button){
selectedCategory=category;
document.querySelectorAll(".categories button").forEach(btn=>btn.classList.remove("active"));
button.classList.add("active");
filterGames();
}

function filterGames(){
const search=document.getElementById("searchInput").value.toLowerCase();
const cards=document.querySelectorAll(".game-card");
let visible=0;

cards.forEach(card=>{
const name=card.querySelector("h3").textContent.toLowerCase();
const category=card.dataset.category;
const categoryMatch=selectedCategory==="All Games"||category===selectedCategory;
const searchMatch=name.includes(search);

if(categoryMatch&&searchMatch){
card.style.display="block";
visible++;
}else{
card.style.display="none";
}
});

document.getElementById("emptyMessage").style.display=visible===0?"block":"none";
}
</script>
</body>
</html>
