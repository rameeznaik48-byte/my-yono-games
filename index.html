<script>
let selectedCategory="All Games";

function setCategory(category,button){
selectedCategory=category;
document.querySelectorAll(".categories button").forEach(btn=>btn.classList.remove("active"));
button.classList.add("active");
filterGames();
}

function filterGames(){
const search=document.getElementById("searchInput").value.toLowerCase();
const cards=document.querySelectorAll("#gamesList .game-card");
let visible=0;

cards.forEach(card=>{
const name=card.querySelector("h3").textContent.toLowerCase();
const category=card.dataset.category;
const categoryMatch=selectedCategory==="All Games"||category===selectedCategory;
const searchMatch=name.includes(search);

if(categoryMatch&&searchMatch){
card.style.display="block";
visible++;
}else{
card.style.display="none";
}
});

document.getElementById("emptyMessage").style.display=visible===0?"block":"none";
}

function updateNewGames(){
const newList=document.getElementById("newGamesList");
const newCards=document.querySelectorAll('#gamesList .game-card[data-new="true"]');

newList.innerHTML="";

newCards.forEach(card=>{
const copy=card.cloneNode(true);
copy.removeAttribute("data-new");
const label=document.createElement("span");
label.className="new-label";
label.textContent="NEW GAME";
copy.prepend(label);
newList.appendChild(copy);
});
}

updateNewGames();
filterGames();
</script>
