<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meri Website</title>
    <style>
        /* पूरी वेबसाइट का बैकग्राउंड रंग हरा (Green) करने के लिए */
        body {
            background-color: #16a34a; /* गहरा हरा रंग (आप चाहें तो 'green' या '#22c55e' भी लिख सकते हैं) */
            color: white; /* टेक्स्ट का रंग सफेद ताकि हरे पर साफ दिखे */
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            margin: 0;
        }

        /* टेलीग्राम बटन का डिज़ाइन */
        .telegram-btn {
            display: inline-block;
            background-color: #0088cc; /* टेलीग्राम का असली नीला रंग */
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
        }

        /* माउस ले जाने पर बटन का रंग थोड़ा बदलेगा */
        .telegram-btn:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <h1>हमारी वेबसाइट पर आपका स्वागत है!</h1>
    <p>ताज़ा अपडेट्स और ऑफर्स के लिए हमारे टेलीग्राम चैनल से जुड़ें।</p>

    <!-- Telegram Channel Link Button -->
    <a href="https://t.me" target="_blank" class="telegram-btn">
        Join Telegram Channel
    </a>

</body>
</html>
