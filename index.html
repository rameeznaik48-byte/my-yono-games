<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Yono Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101014;color:white;font-family:Arial,sans-serif}
header{background:#19191f;padding:18px 15px;text-align:center;border-bottom:2px solid #e53935}
.logo{font-size:27px;font-weight:bold;color:#fff}
.logo span{color:#ff4545}
header p{color:#aaa;margin:7px 0 0;font-size:13px}
.hero{text-align:center;padding:35px 15px;background:linear-gradient(135deg,#291313,#17171d)}
.hero h1{font-size:29px;margin:0 0 10px}
.hero p{color:#ccc;font-size:14px}
.btn{display:inline-block;background:#e53935;color:white;text-decoration:none;border:0;border-radius:7px;padding:12px 22px;font-weight:bold;margin:8px 4px;cursor:pointer}
.btn.secondary{background:#292930;border:1px solid #555}
nav{display:flex;gap:9px;overflow-x:auto;padding:14px;background:#19191f}
nav button{white-space:nowrap;background:#292930;color:white;border:1px solid #444;border-radius:20px;padding:10px 15px;cursor:pointer}
nav button.active{background:#e53935;border-color:#e53935}
main{padding:20px 14px;max-width:1100px;margin:auto}
.section-title{font-size:21px;margin:10px 0 17px}
.search{width:100%;padding:13px;border-radius:8px;border:1px solid #444;background:#202027;color:white;margin-bottom:20px;font-size:15px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}
.game{background:#1d1d24;border:1px solid #333;border-radius:12px;overflow:hidden}
.game-logo{height:115px;background:#292930;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:bold;color:#ff5555}
.game-info{padding:13px}
.game-info h3{margin:0 0 7px;font-size:17px}
.game-info p{margin:0;color:#aaa;font-size:12px}
.game-info .btn{width:100%;text-align:center;margin:13px 0 0;padding:11px}
.empty{color:#aaa;text-align:center;padding:30px;grid-column:1/-1}
footer{text-align:center;padding:25px;color:#888;background:#19191f;margin-top:30px;font-size:13px}
</style>
</head>
<body>

<header>
  <div class="logo">MY YONO <span>GAMES</span></div>
  <p>Explore Games • Play Online • Discover More</p>
</header>

<section class="hero">
  <h1>Welcome to My Yono Games</h1>
  <p>Explore your favourite games in one place</p>
  <button class="btn" onclick="showGames('All Games')">PLAY NOW</button>
  <button class="btn secondary" onclick="showGames('Explore Now')">EXPLORE NOW</button>
</section>

<nav id="menu">
  <button class="active" onclick="showGames('All Games',this)">All Games</button>
  <button onclick="showGames('Explore Now',this)">Explore Now</button>
  <button onclick="showGames('Casino Games',this)">Casino Games</button>
  <button onclick="showGames('Dice Games',this)">Dice Games</button>
  <button onclick="showGames('Card Games',this)">Card Games</button>
  <button onclick="showGames('Mini Games',this)">Mini Games</button>
  <button onclick="showGames('Android Apps',this)">Android Apps</button>
  <button onclick="showGames('Gaming Apps',this)">Gaming Apps</button>
  <button onclick="showGames('New Apps',this)">New Apps</button>
</nav>

<main>
  <input class="search" id="search" type="search"
    placeholder="Search games..." oninput="renderGames()">

  <h2 class="section-title" id="heading">All Games</h2>
  <div class="games" id="games"></div>
</main>

<footer>
  © 2026 My Yono Games. All Rights Reserved.
</footer>

<script>
// Add new games inside this list.
// Every game will appear in every section.
const gameList = [
  {
    name: "Dhan Game",
    category: "Casino Game",
    link: "https://www.dhangmaegame.com/?code=47T85N5B1AU&t=1794756436",
    logo: "DHAN"
  }
];

let currentSection = "All Games";

function showGames(section, button) {
  currentSection = section;
  document.getElementById("heading").textContent = section;

  document.querySelectorAll("#menu button").forEach(b => {
    b.classList.remove("active");
  });

  if (button) button.classList.add("active");
  renderGames();
}

function renderGames() {
  const search = document.getElementById("search").value.toLowerCase();
  const container = document.getElementById("games");

  const filtered = gameList.filter(game =>
    game.name.toLowerCase().includes(search) ||
    game.category.toLowerCase().includes(search)
  );

  container.innerHTML = "";

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">No games found.</div>';
    return;
  }

  filtered.forEach(game => {
    const card = document.createElement("div");
    card.className = "game";

    const logo = document.createElement("div");
    logo.className = "game-logo";
    logo.textContent = game.logo || game.name;

    const info = document.createElement("div");
    info.className = "game-info";

    const name = document.createElement("h3");
    name.textContent = game.name;

    const category = document.createElement("p");
    category.textContent = game.category;

    const link = document.createElement("a");
    link.className = "btn";
    link.textContent = "PLAY NOW";
    link.href = game.link;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    info.append(name, category, link);
    card.append(logo, info);
    container.appendChild(card);
  });
}

renderGames();
</script>
</body>
</html>
<div style="background:#0088cc;text-align:center;padding:13px;width:100%;">

     target="_blank"
     rel="noopener noreferrer"
     style="display:inline-block;color:white;text-decoration:none;font-weight:bold;font-size:17px;">
    JOIN TELEGRAM
  </a>
</div>
